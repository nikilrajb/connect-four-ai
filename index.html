<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Four AI</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="description" content="Play Connect Four against an AI opponent with multiple difficulty levels">
</head>
<body>

    <!-- ── Header ──────────────────────────────────────────────── -->
    <header class="site-header">
        <div class="header-inner">
            <h1 class="site-title">
                <span class="title-icon">🔴</span> Connect Four AI
            </h1>
            <div class="difficulty-controls">
                <label for="difficulty" class="difficulty-label">Difficulty:</label>
                <div class="difficulty-buttons">
                    <button class="diff-btn" data-value="easy">Easy</button>
                    <button class="diff-btn active" data-value="medium">Medium</button>
                    <button class="diff-btn" data-value="hard">Hard</button>
                    <!-- Hidden select used by the JS event listener for consistency -->
                    <select id="difficulty" aria-hidden="true" style="display:none">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- ── Main content ─────────────────────────────────────────── -->
    <main class="main-content">

        <!-- Score panel -->
        <section class="score-panel" aria-label="Score board">
            <div class="score-card score-card--player">
                <div class="score-disc disc-player"></div>
                <div class="score-info">
                    <span class="score-label">You</span>
                    <span class="score-value" id="player-score">0</span>
                </div>
            </div>

            <div class="score-card score-card--draws">
                <div class="score-disc disc-draw">🤝</div>
                <div class="score-info">
                    <span class="score-label">Draws</span>
                    <span class="score-value" id="draw-score">0</span>
                </div>
            </div>

            <div class="score-card score-card--ai">
                <div class="score-disc disc-ai"></div>
                <div class="score-info">
                    <span class="score-label">AI</span>
                    <span class="score-value" id="ai-score">0</span>
                </div>
            </div>
        </section>

        <!-- Game area -->
        <section class="game-area">
            <!-- Status bar -->
            <div class="game-status" id="game-status" role="status" aria-live="polite">
                Your turn! 🎮
            </div>

            <!-- Column drop indicators (appear on hover / keyboard) -->
            <div class="drop-indicators" id="drop-indicators" aria-hidden="true">
                <div class="drop-arrow">▼</div>
                <div class="drop-arrow">▼</div>
                <div class="drop-arrow">▼</div>
                <div class="drop-arrow">▼</div>
                <div class="drop-arrow">▼</div>
                <div class="drop-arrow">▼</div>
                <div class="drop-arrow">▼</div>
            </div>

            <!-- The board is rendered here by JavaScript -->
            <div class="game-board" id="game-board" role="grid" aria-label="Connect Four board"></div>

            <!-- Controls -->
            <div class="controls">
                <button id="new-game-btn" class="btn btn-primary">
                    <span>🔄</span> New Game
                </button>
                <button id="undo-btn" class="btn btn-secondary">
                    <span>↩️</span> Undo
                </button>
            </div>
        </section>

        <!-- Keyboard hint -->
        <p class="keyboard-hint">
            ← → to select column &nbsp;·&nbsp; Enter / Space to drop &nbsp;·&nbsp; Z to undo &nbsp;·&nbsp; N for new game
        </p>

    </main>

    <!-- ── Footer ──────────────────────────────────────────────── -->
    <footer class="site-footer">
        <p>Created by Nikhil Raj B &nbsp;|&nbsp; Computer Science Project (Oct – Nov 2024)</p>
    </footer>

    <!-- Scripts: load order matters (board → ai → game → ui → main) -->
    <script src="js/board.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>

    <!-- Difficulty button wiring (runs after DOM is ready) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const diffSelect  = document.getElementById('difficulty');
            const diffButtons = document.querySelectorAll('.diff-btn');

            diffButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    diffButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    diffSelect.value = btn.dataset.value;
                    // Dispatch change event so main.js listener picks it up
                    diffSelect.dispatchEvent(new Event('change'));
                });
            });
        });
    </script>
</body>
</html>
